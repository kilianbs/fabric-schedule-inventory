<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Fabric Schedule Inventory</title>
  <desc id="desc">Open-source Microsoft Fabric app that inventories scheduled items across workspaces and shows them on a typical-day Gantt timeline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1fb"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f4f0"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#117865"/>
      <stop offset="0.55" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#742774"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d1d1d1" stroke-opacity="0.34"/>
    </pattern>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff"/>
      <path d="M0 0V6" stroke="#8a8a8a" stroke-width="2"/>
    </pattern>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#background)"/>
  <rect width="1600" height="500" fill="url(#grid)" opacity="0.55"/>
  <circle cx="132" cy="86" r="190" fill="#0078d4" opacity="0.035"/>
  <circle cx="1480" cy="470" r="250" fill="#117865" opacity="0.045"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Badges -->
    <g transform="translate(80 56)" font-size="12" font-weight="650">
      <g>
        <rect width="122" height="32" rx="16" fill="#f1faf1" stroke="#9fd89f"/>
        <circle cx="18" cy="16" r="4" fill="#0e700e"/>
        <text x="31" y="20" fill="#0e700e">OPEN SOURCE</text>
      </g>
      <g transform="translate(134)">
        <rect width="112" height="32" rx="16" fill="#ffffff" stroke="#d1d1d1"/>
        <text x="18" y="20" fill="#424242">MIT LICENSED</text>
      </g>
      <g transform="translate(258)">
        <rect width="124" height="32" rx="16" fill="#eef6fc" stroke="#a9d3f2"/>
        <text x="18" y="20" fill="#005a9e">FABRIC NATIVE</text>
      </g>
    </g>

    <!-- Logo: clock over a timeline -->
    <g transform="translate(80 126)">
      <rect width="78" height="78" rx="18" fill="url(#brand)" filter="url(#shadow4)"/>
      <circle cx="39" cy="35" r="17" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M39 25V35L46 39" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 62H30M36 62H60" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="182" y="146" fill="#005a9e" font-size="13" font-weight="700" letter-spacing="1.5">MICROSOFT FABRIC SCHEDULING</text>
    <text x="182" y="198" fill="#242424" font-size="58" font-weight="700" letter-spacing="-1.4">Schedule Inventory</text>
    <text x="80" y="270" fill="#242424" font-size="27" font-weight="500">Know what runs in Fabric, and when.</text>
    <text x="80" y="310" fill="#616161" font-size="17">Workspaces &#183; schedules &#183; run history &#183; Gantt timeline &#183; overlaps</text>

    <!-- Feature cards -->
    <g transform="translate(80 354)">
      <g>
        <rect width="158" height="66" rx="10" fill="#ffffff" stroke="#e0e0e0" filter="url(#shadow4)"/>
        <rect x="14" y="14" width="38" height="38" rx="9" fill="#e3f7ef"/>
        <path d="M41 28A9 9 0 0 0 25 30M25 38A9 9 0 0 0 41 36" fill="none" stroke="#117865" stroke-width="2" stroke-linecap="round"/>
        <path d="M41 23V28H36M25 43V38H30" fill="none" stroke="#117865" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="66" y="29" fill="#242424" font-size="13" font-weight="650">Scan</text>
        <text x="66" y="47" fill="#616161" font-size="11">Every workspace</text>
      </g>
      <g transform="translate(170)">
        <rect width="158" height="66" rx="10" fill="#ffffff" stroke="#e0e0e0" filter="url(#shadow4)"/>
        <rect x="14" y="14" width="38" height="38" rx="9" fill="#eef6fc"/>
        <path d="M24 25H42V42H24ZM24 31H42M30 25V42" fill="none" stroke="#0078d4" stroke-width="1.8"/>
        <text x="66" y="29" fill="#242424" font-size="13" font-weight="650">Inventory</text>
        <text x="66" y="47" fill="#616161" font-size="11">Search and filter</text>
      </g>
      <g transform="translate(340)">
        <rect width="158" height="66" rx="10" fill="#ffffff" stroke="#e0e0e0" filter="url(#shadow4)"/>
        <rect x="14" y="14" width="38" height="38" rx="9" fill="#f7eff8"/>
        <path d="M24 24V43H43" fill="none" stroke="#742774" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M28 29H36M31 34H41M29 39H34" stroke="#742774" stroke-width="2.6" stroke-linecap="round"/>
        <text x="66" y="29" fill="#242424" font-size="13" font-weight="650">Timeline</text>
        <text x="66" y="47" fill="#616161" font-size="11">Typical-day Gantt</text>
      </g>
      <g transform="translate(510)">
        <rect width="158" height="66" rx="10" fill="#ffffff" stroke="#e0e0e0" filter="url(#shadow4)"/>
        <rect x="14" y="14" width="38" height="38" rx="9" fill="#fffef5"/>
        <path d="M33 23L44 42H22Z" fill="none" stroke="#817400" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M33 30V35" stroke="#817400" stroke-width="2" stroke-linecap="round"/>
        <circle cx="33" cy="38.5" r="1.3" fill="#817400"/>
        <text x="66" y="29" fill="#242424" font-size="13" font-weight="650">Overlaps</text>
        <text x="66" y="47" fill="#616161" font-size="11">Spot load peaks</text>
      </g>
    </g>

    <!-- App window: mini Gantt with illustrative data -->
    <g transform="translate(840 60)">
      <rect width="680" height="380" rx="18" fill="#ffffff" stroke="#d1d1d1" filter="url(#shadow8)"/>
      <path d="M0 56V18A18 18 0 0 1 18 0H662A18 18 0 0 1 680 18V56Z" fill="#fafafa"/>
      <path d="M0 56H680" stroke="#e0e0e0"/>
      <circle cx="26" cy="28" r="5" fill="#bc2f32"/>
      <circle cx="44" cy="28" r="5" fill="#817400"/>
      <circle cx="62" cy="28" r="5" fill="#0e700e"/>
      <text x="84" y="33" fill="#616161" font-size="12">Schedule Gantt &#183; typical day</text>
      <rect x="548" y="14" width="108" height="28" rx="6" fill="#ffffff" stroke="#d1d1d1"/>
      <text x="562" y="32" fill="#424242" font-size="12">Wednesday</text>
      <path d="M638 25L642 29L646 25" fill="none" stroke="#616161" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Hour axis: x = 194 + hours * 19.25 -->
      <g font-size="10" fill="#616161">
        <text x="24" y="84" font-weight="650" fill="#424242">Artifact</text>
        <text x="194" y="84" text-anchor="middle">00</text>
        <text x="271" y="84" text-anchor="middle">04</text>
        <text x="348" y="84" text-anchor="middle">08</text>
        <text x="425" y="84" text-anchor="middle">12</text>
        <text x="502" y="84" text-anchor="middle">16</text>
        <text x="579" y="84" text-anchor="middle">20</text>
        <text x="656" y="84" text-anchor="middle">24</text>
      </g>
      <g stroke="#ececec">
        <path d="M194 92V280M271 92V280M348 92V280M425 92V280M502 92V280M579 92V280M656 92V280"/>
        <path d="M24 92H656M24 126H656M24 156H656M24 188H656M24 220H656M24 250H656M24 280H656"/>
      </g>

      <!-- Group: Sales -->
      <rect x="24" y="93" width="632" height="32" fill="#f7f7f7"/>
      <text x="32" y="108" fill="#242424" font-size="12" font-weight="650">Sales</text>
      <text x="32" y="120" fill="#616161" font-size="9.5">peak 2 at 06:00</text>
      <rect x="194" y="104" width="462" height="10" rx="2" fill="#ececec"/>
      <rect x="290" y="104" width="48" height="10" fill="#9cc8ec"/>
      <rect x="309.5" y="104" width="19.3" height="10" fill="#bc2f32"/>
      <rect x="540.5" y="104" width="19.3" height="10" fill="#9cc8ec"/>

      <rect x="32" y="135" width="10" height="10" rx="2" fill="#117865"/>
      <text x="48" y="144" fill="#242424" font-size="11.5">pl_ingest_daily</text>
      <rect x="290" y="134" width="48" height="14" rx="3" fill="#117865"/>

      <rect x="32" y="166" width="10" height="10" rx="2" fill="#742774"/>
      <text x="48" y="175" fill="#242424" font-size="11.5">nb_sales_model</text>
      <rect x="309.5" y="165" width="19.3" height="14" rx="3" fill="#742774"/>
      <rect x="540.5" y="165" width="19.3" height="14" rx="3" fill="#742774"/>

      <!-- Group: Finance -->
      <rect x="24" y="189" width="632" height="30" fill="#f7f7f7"/>
      <text x="32" y="203" fill="#242424" font-size="12" font-weight="650">Finance</text>
      <text x="32" y="215" fill="#616161" font-size="9.5">peak 1 &#183; every 2 h</text>
      <rect x="194" y="199" width="462" height="10" rx="2" fill="#ececec"/>
      <g fill="#9cc8ec">
        <rect x="194" y="199" width="6.4" height="10"/><rect x="232.5" y="199" width="6.4" height="10"/>
        <rect x="271" y="199" width="6.4" height="10"/><rect x="309.5" y="199" width="6.4" height="10"/>
        <rect x="348" y="199" width="6.4" height="10"/><rect x="386.5" y="199" width="6.4" height="10"/>
        <rect x="425" y="199" width="28.9" height="10"/><rect x="463.5" y="199" width="6.4" height="10"/>
        <rect x="502" y="199" width="6.4" height="10"/><rect x="540.5" y="199" width="6.4" height="10"/>
        <rect x="579" y="199" width="6.4" height="10"/><rect x="617.5" y="199" width="6.4" height="10"/>
      </g>
      <rect x="425" y="199" width="6.4" height="10" fill="#bc2f32"/>

      <rect x="32" y="230" width="10" height="10" rx="2" fill="#0e700e"/>
      <text x="48" y="239" fill="#242424" font-size="11.5">copy_ledger</text>
      <g fill="#0e700e">
        <rect x="194" y="228" width="6.4" height="14" rx="2"/><rect x="232.5" y="228" width="6.4" height="14" rx="2"/>
        <rect x="271" y="228" width="6.4" height="14" rx="2"/><rect x="309.5" y="228" width="6.4" height="14" rx="2"/>
        <rect x="348" y="228" width="6.4" height="14" rx="2"/><rect x="386.5" y="228" width="6.4" height="14" rx="2"/>
        <rect x="425" y="228" width="6.4" height="14" rx="2"/><rect x="463.5" y="228" width="6.4" height="14" rx="2"/>
        <rect x="502" y="228" width="6.4" height="14" rx="2"/><rect x="540.5" y="228" width="6.4" height="14" rx="2"/>
        <rect x="579" y="228" width="6.4" height="14" rx="2"/><rect x="617.5" y="228" width="6.4" height="14" rx="2"/>
      </g>

      <rect x="32" y="260" width="10" height="10" rx="2" fill="#0078d4"/>
      <text x="48" y="269" fill="#242424" font-size="11.5">df_refresh_gl</text>
      <rect x="425" y="258" width="28.9" height="14" rx="3" fill="#0078d4"/>
      <rect x="598.25" y="258" width="14" height="14" rx="3" fill="url(#hatch)" stroke="#8a8a8a"/>

      <!-- Now marker -->
      <path d="M372.4 75V280" stroke="#0078d4" stroke-width="1.5"/>
      <rect x="347" y="59" width="51" height="16" rx="4" fill="#0078d4"/>
      <text x="372.4" y="71" fill="#ffffff" font-size="10" font-weight="650" text-anchor="middle">Now 09:16</text>

      <!-- Legend -->
      <g transform="translate(24 300)" font-size="11" fill="#424242">
        <rect y="0" width="12" height="12" rx="2" fill="#117865"/><text x="18" y="10">Pipeline</text>
        <rect x="82" y="0" width="12" height="12" rx="2" fill="#742774"/><text x="100" y="10">Notebook</text>
        <rect x="172" y="0" width="12" height="12" rx="2" fill="#0e700e"/><text x="190" y="10">Copy job</text>
        <rect x="258" y="0" width="12" height="12" rx="2" fill="#0078d4"/><text x="276" y="10">Dataflow</text>
        <rect x="342" y="0" width="12" height="12" rx="2" fill="url(#hatch)" stroke="#8a8a8a"/><text x="360" y="10">No run history</text>
        <rect x="458" y="0" width="12" height="12" rx="2" fill="#bc2f32"/><text x="476" y="10">Concurrent runs</text>
      </g>

      <g transform="translate(24 342)">
        <circle cx="8" cy="8" r="5" fill="#0e700e"/>
        <text x="22" y="12" fill="#424242" font-size="11" font-weight="600">Metadata only</text>
        <text x="124" y="12" fill="#bdbdbd" font-size="11">&#183;</text>
        <text x="140" y="12" fill="#424242" font-size="11" font-weight="600">Deployed in Fabric</text>
        <text x="258" y="12" fill="#bdbdbd" font-size="11">&#183;</text>
        <text x="274" y="12" fill="#424242" font-size="11" font-weight="600">Built with React and Rayfin</text>
      </g>
    </g>
  </g>
</svg>
